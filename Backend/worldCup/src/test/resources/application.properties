# Config exclusiva para tests. Sobrescribe solo lo necesario del application.yml
# principal (que tiene jwt-secret vacío para forzar configuración consciente en prod).
# Un secret de test válido (>=32 bytes, sin placeholders) permite que los slices
# @WebMvcTest instancien el JwtTokenProvider sin fallar en su validación de arranque.
app.security.jwt-secret=test-jwt-secret-0123456789-abcdefghij-klmnopqrstuvwxyz
