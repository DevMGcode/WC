spring:
  application:
    name: mundial2026-backend

  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5434/worldcup2026_db}"
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD:postgres}"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  mail:
    host: "${MAIL_HOST:smtp.gmail.com}"
    port: "${MAIL_PORT:587}"
    username: "${MAIL_USERNAME:}"
    password: "${MAIL_PASSWORD:}"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        ssl:
          trust: "*"

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt-secret: "${JWT_SECRET:change-this-secret-key-change-this-secret-key}"
    jwt-expiration-ms: 86400000
    jwt-refresh-expiration-ms: 604800000
  frontend-url: "${FRONTEND_URL:http://localhost:3000}"
  email:
    verification-required: "${EMAIL_VERIFICATION_REQUIRED:true}"
  payments:
    # Modo de operación: "mock" (default, sin credenciales) | "real"
    mercado-pago:
      mode: "${MERCADO_PAGO_MODE:mock}"
      access-token:   "${MERCADO_PAGO_ACCESS_TOKEN:}"
      public-key:     "${MERCADO_PAGO_PUBLIC_KEY:}"
      webhook-secret: "${MERCADO_PAGO_WEBHOOK_SECRET:}"
      # URL pública del backend donde Mercado Pago notifica los pagos.
      # En local, expón tu backend con ngrok (https://ngrok.com) y pega aquí la URL.
      notification-url: "${MERCADO_PAGO_NOTIFICATION_URL:}"

apifootball:
  base-url: "${APIFOOTBALL_BASE_URL:https://v3.football.api-sports.io}"
  api-key: "${APIFOOTBALL_API_KEY:}"
  mode: "${APIFOOTBALL_MODE:DIRECT}"
  rapidapi-host: "api-football-v1.p.rapidapi.com"
  league-id: 1
  season: 2026
  timeout-ms: 5000
  connect-timeout-ms: 2000

tournament:
  sync:
    enabled: "${SYNC_ENABLED:true}"
    live-poll-ms: "${LIVE_POLL_MS:5000}"
    # Set to true once API-Football enables events/lineups/stats coverage for the active season.
    # For 2026, the API returns empty arrays — polling wastes daily quota with no data gain.
    events-enabled: "${SYNC_EVENTS_ENABLED:false}"
    event-poll-ms: "${EVENT_POLL_MS:15000}"
    csv-bootstrap-path: classpath:data/fixtures-bootstrap.csv
