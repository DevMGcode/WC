services:
  postgres:
    image: postgres:17
    container_name: mundial2026-postgres-dev
    environment:
      POSTGRES_DB: worldcup2026_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mundial2026-pgadmin-dev
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: mundial2026-backend-dev
    env_file:
      - .env
    environment:
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - maven_cache:/root/.m2
    depends_on:
      - postgres

  # ── FRONTEND DEV (HMR activo, usar para desarrollo activo) ──
  frontend-dev:
    build:
      context: ../../Frontend/mundial-app
      dockerfile: Dockerfile.dev
    image: worldcup-frontend-dev
    container_name: mundial2026-frontend-DEV
    profiles: ["dev"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
      INTERNAL_API_BASE_URL: http://backend:8080
      NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_GLITCHTIP_DSN: https://50fa4312c0e24ee7a789d0ac328963f5@app.glitchtip.com/24132
      NEXT_PUBLIC_GA_ID: G-FJGDNVCDL5
    ports:
      - "3000:3000"
    volumes:
      - ../../Frontend/mundial-app:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    depends_on:
      - backend

  # ── FRONTEND PROD (build optimizado, navegación instantánea) ──
  frontend:
    build:
      context: ../../Frontend/mundial-app
      # Dockerfile vive en PRODUCCION_DEPLOY/ (toda la config prod junta).
      # Ruta relativa al directorio de este compose (Backend/worldCup/).
      dockerfile: ../../PRODUCCION_DEPLOY/Dockerfile.frontend.prod
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api
        NEXT_PUBLIC_APP_URL: http://localhost:3000
        NEXT_PUBLIC_GLITCHTIP_DSN: https://50fa4312c0e24ee7a789d0ac328963f5@app.glitchtip.com/24132
        NEXT_PUBLIC_GA_ID: G-FJGDNVCDL5
        NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws
        INTERNAL_API_BASE_URL: http://backend:8080
    image: worldcup-frontend-prod
    container_name: mundial2026-frontend-PROD
    profiles: ["prod"]
    environment:
      INTERNAL_API_BASE_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data_dev:
  maven_cache:
  frontend_node_modules:
  frontend_next_cache:
