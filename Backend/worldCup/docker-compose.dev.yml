services:
  postgres:
    image: postgres:17
    container_name: mundial2026-postgres-dev
    environment:
      POSTGRES_DB: worldcup2026_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mundial2026-pgadmin-dev
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: mundial2026-backend-dev
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/worldcup2026_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: change-this-secret-key-change-this-secret-key
      SPRING_DEVTOOLS_RESTART_ENABLED: "false"
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - maven_cache:/root/.m2
    depends_on:
      - postgres

  frontend:
    build:
      context: ../../Frontend/mundial-app
      dockerfile: Dockerfile.dev
    container_name: mundial2026-frontend-dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
      INTERNAL_API_BASE_URL: http://backend:8080
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ../../Frontend/mundial-app:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    depends_on:
      - backend

volumes:
  postgres_data_dev:
  maven_cache:
  frontend_node_modules:
  frontend_next_cache:
