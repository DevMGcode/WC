name: Deploy a producción (EC2)

# Se dispara con cada push a main, o manualmente desde la pestaña Actions
on:
  push:
    branches: [main]
  workflow_dispatch:

# Evita dos deploys simultáneos si llegan pushes seguidos
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar en EC2
    runs-on: ubuntu-latest
    steps:
      - name: Conectar por SSH y actualizar contenedores
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ${{ secrets.EC2_APP_DIR }}
            echo "── Bajando últimos cambios de main ──"
            git fetch origin main
            git reset --hard origin/main
            cd PRODUCCION_DEPLOY
            echo "── Reconstruyendo backend y frontend ──"
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build backend frontend
            echo "── Limpiando imágenes viejas ──"
            docker image prune -f
            echo "── Estado final ──"
            docker compose -f docker-compose.prod.yml --env-file .env.prod ps
