# ── Orionix Gol — Nginx Producción ────────────────────────────────────────────

server {
    listen 80;
    server_name orionixgol.com www.orionixgol.com;

    # Certbot challenge (para obtener el certificado SSL)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo HTTP → HTTPS www (canónico)
    location / {
        return 301 https://www.orionixgol.com$request_uri;
    }
}

# HTTPS sin www → www (redirect permanente — canónico para SEO)
server {
    listen 443 ssl;
    server_name orionixgol.com;

    ssl_certificate     /etc/letsencrypt/live/orionixgol.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orionixgol.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    return 301 https://www.orionixgol.com$request_uri;
}

server {
    listen 443 ssl;
    resolver 127.0.0.11 valid=10s;
    server_name www.orionixgol.com;

    ssl_certificate     /etc/letsencrypt/live/orionixgol.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orionixgol.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ── Frontend Next.js ──────────────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Backend API ───────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── WebSocket (live scores) ───────────────────────────────────────────────
    location /ws {
        proxy_pass         http://backend:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
    }

    # ── Swagger UI (solo acceso interno, opcional) ────────────────────────────
    location /swagger-ui/ {
        proxy_pass http://backend:8080/swagger-ui/;
        proxy_set_header Host $host;
    }

    client_max_body_size 10M;
}
