services:

  # ── Base de datos ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17
    container_name: orionix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: worldcup2026_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend Spring Boot ───────────────────────────────────────────────────────
  backend:
    build:
      context: ../Backend/worldCup
      dockerfile: ../../PRODUCCION_DEPLOY/Dockerfile.backend.prod
    image: orionix-backend:prod
    container_name: orionix-backend
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      APIFOOTBALL_API_KEY: ${APIFOOTBALL_API_KEY}
      APIFOOTBALL_BASE_URL: ${APIFOOTBALL_BASE_URL}
      APIFOOTBALL_MODE: ${APIFOOTBALL_MODE}
      SYNC_ENABLED: ${SYNC_ENABLED}
      LIVE_POLL_MS: ${LIVE_POLL_MS}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED}
      FRONTEND_URL: ${FRONTEND_URL}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /actuator/health es público (whitelist en SecurityConfig). Usamos `wget`
      # porque la imagen `eclipse-temurin:21-jre` NO incluye `curl`.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Frontend Next.js ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../Frontend/mundial-app
      # Dockerfile vive en PRODUCCION_DEPLOY/ (toda la config de prod junta).
      # La ruta es relativa al directorio de este compose, no al `context`.
      dockerfile: ../PRODUCCION_DEPLOY/Dockerfile.frontend.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
        # Next.js hornea las NEXT_PUBLIC_* en el bundle durante el build.
        # Si estas variables no se pasan aquí, el frontend de producción NO
        # enviará eventos a GlitchTip ni registrará visitas en GA4.
        NEXT_PUBLIC_GLITCHTIP_DSN: ${NEXT_PUBLIC_GLITCHTIP_DSN}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID}
        INTERNAL_API_BASE_URL: http://backend:8080
    image: orionix-frontend:prod
    container_name: orionix-frontend
    restart: unless-stopped
    environment:
      INTERNAL_API_BASE_URL: http://backend:8080
      NODE_ENV: production
    networks:
      - internal
      - public
    depends_on:
      backend:
        condition: service_healthy

  # ── Nginx — proxy inverso + SSL ───────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: orionix-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    networks:
      - public
    depends_on:
      - frontend

  # ── Certbot — certificado SSL gratuito (Let's Encrypt) ───────────────────────
  certbot:
    image: certbot/certbot
    container_name: orionix-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Se ejecuta manualmente para obtener/renovar el certificado:
    #   docker compose -f docker-compose.prod.yml run --rm certbot certonly \
    #     --webroot -w /var/www/certbot \
    #     -d tu-dominio.com --email tu@email.com --agree-tos --no-eff-email
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"

volumes:
  postgres_data:
  certbot_www:
  certbot_certs:

networks:
  internal:
    driver: bridge
  public:
    driver: bridge
