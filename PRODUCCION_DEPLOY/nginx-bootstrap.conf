# ── Orionix Gol — Nginx BOOTSTRAP (solo HTTP) ────────────────────────────────
#
# Este archivo se usa SOLO la primera vez que despliegas, para que certbot
# pueda emitir el certificado SSL. Una vez emitido, cambia el mount del
# volumen de nginx en docker-compose.prod.yml para usar `nginx.conf` (el
# config final con HTTPS) y reinicia el contenedor.
#
# Reemplaza TU_DOMINIO con tu dominio real antes de usar este archivo:
#   sed -i 's/TU_DOMINIO/tu-dominio.com/g' nginx-bootstrap.conf

server {
    listen 80;
    server_name TU_DOMINIO www.TU_DOMINIO;

    # Endpoint que certbot usa para el HTTP-01 challenge.
    # certbot escribe un archivo en /var/www/certbot y Let's Encrypt lo lee
    # por http://TU_DOMINIO/.well-known/acme-challenge/<token>.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Mientras no tengamos cert SSL, respondemos un 200 simple en /
    # (NO redirigimos a https porque no existe todavía).
    location / {
        return 200 'Orionix Gol — esperando certificado SSL...\n';
        add_header Content-Type text/plain;
    }
}
