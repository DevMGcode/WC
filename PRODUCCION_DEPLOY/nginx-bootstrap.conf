# ── Orionix Gol — Nginx BOOTSTRAP (solo HTTP) ────────────────────────────────

server {
    listen 80;
    server_name www.orionixgol.com www.orionixgol.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'Orionix Gol — esperando certificado SSL...\n';
        add_header Content-Type text/plain;
    }
}
